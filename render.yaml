# BoviPulse Render blueprint — mirrors the LIVE setup.
# Live reality (dashboard-created services):
#   Backend  -> https://kabhackathon.onrender.com (this blueprint's bovipulse-api)
#   Frontend -> https://bovipulse.vercel.app (hosted on Vercel, NOT Render)
#   Database -> Neon Postgres (external; no Render database is provisioned here)
# Secrets (DATABASE_URL, DIRECT_URL, JWT_SECRET, CORS_ORIGIN) are set in the
# Render dashboard, never in this file. `sync: false` makes the dashboard
# prompt for them on first blueprint apply.

services:
  - type: web
    name: bovipulse-inference
    env: python
    plan: free
    rootDir: inference
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port 8000
    healthCheckPath: /health
    envVars:
      - key: MODEL_DIR
        value: ../models
      - key: MODEL_VERSION
        value: rf-300-external-v1
      - key: ISO_MODEL_VERSION
        value: iso-300-external-v1

  - type: web
    name: bovipulse-api
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: INFERENCE_URL
        fromService:
          name: bovipulse-inference
          type: web
          property: host
      - key: CORS_ORIGIN
        value: https://bovipulse.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: THERMAL_FEVER_THRESHOLD_C
        value: 39.5

# Frontend is deployed on Vercel from the same repo (root directory:
# bovipulse/frontend) with:
#   VITE_API_URL=https://kabhackathon.onrender.com
# No Render static service is needed, so none is declared here.
